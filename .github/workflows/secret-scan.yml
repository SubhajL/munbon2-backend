name: Secret Scan (diff)

# Stop-the-bleeding gate: blocks NEW additions of known/likely secrets in a change.
# The historical backlog (the leaked DB password committed across many files) is handled
# separately by credential ROTATION + a source scrub + git-history purge.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan added lines for secrets
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.sha }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base="$(git rev-parse HEAD~1 2>/dev/null || echo HEAD)"
          fi
          # Exclude THIS workflow from the scan: it legitimately contains the detection
          # patterns, so scanning its own introducing diff would self-match and false-fail.
          git diff "$base" "$head" -- . ':(exclude).github/workflows/secret-scan.yml' \
            | grep '^+' > added.txt || true
          if grep -Eq '__ROTATED_DB_PASSWORD__|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY' added.txt; then
            echo "::error::A known or likely secret was added in this change. Move it to an env var / secret manager and rotate the credential."
            exit 1
          fi
          echo "No new secrets detected in the diff."
