name: Secret Scan (diff)

# Stop-the-bleeding gate: blocks NEW additions of known/likely secrets in a change.
# The historical backlog (the leaked DB password committed across many files) is handled
# separately by credential ROTATION + a source scrub + git-history purge.
#
# Hardened (Wave 0.7, PROGRAM_REVIEW_2026-07-09 + Codex adversarial review):
#  - scans PER-COMMIT patches over the pushed/PR range (an add-then-remove inside one
#    push can no longer hide a secret in history) PLUS the endpoint diff (covers
#    merge-introduced content)
#  - unusable/zero push base and base==head (force-push edge) fall back to head~1 so
#    the scan can never silently run on an EMPTY diff
#  - --text --no-ext-diff --no-textconv --no-renames: binary/.gitattributes tricks and
#    pure renames cannot suppress added-line content
#  - this file is NO LONGER excluded from its own scan: detection patterns are
#    assembled from fragments at runtime, so the workflow cannot self-match
#  - credential-bearing connection strings to non-allowlisted hosts HARD-FAIL unless
#    the password is an obvious placeholder (then they warn); allowed hosts are
#    boundary-anchored so `db.evil.com` is not hidden by the `db` alias
#
# Known limits (accepted, documented):
#  - a determined committer can still split/encode a secret across lines (the same
#    trick this file uses to avoid self-matching) — a real scanner (gitleaks) over
#    changed blobs is the Wave-1.11 follow-up, after the history purge (a full-tree
#    baseline is guaranteed-red while the historical backlog is still tracked)
#  - rewriting main's history is a branch-protection concern (disallow force-push,
#    REQUIRE this check), enforceable once GitHub Actions billing (E6) is fixed
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan added lines for secrets
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.sha }}"
          zero="0000000000000000000000000000000000000000"
          if [ -z "$base" ] || [ "$base" = "$zero" ] || ! git cat-file -e "$base" 2>/dev/null || [ "$(git rev-parse "$base")" = "$(git rev-parse "$head")" ]; then
            # New-branch push, force-push with unusable before, or base==head: fall
            # back to head~1 — never risk scanning an EMPTY diff. (Not the empty tree:
            # a full-tree scan is guaranteed-red until the historical backlog is
            # purged; main's force-push protection belongs to branch rules.)
            base="$(git rev-parse "$head~1" 2>/dev/null || git hash-object -t tree /dev/null)"
          fi

          DIFF_FLAGS="--no-renames --text --no-ext-diff --no-textconv --unified=0"
          {
            git diff $DIFF_FLAGS "$base" "$head"
            git log -p $DIFF_FLAGS "$base..$head" 2>/dev/null || true
          } | grep '^+' > added.txt || true

          # Patterns are split so THIS file never matches its own scan.
          pw='P@ssw0rd''123!'
          ip='43\.208''\.201\.191'
          hard="($pw|$ip|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY)"
          if grep -Eq "$hard" added.txt; then
            echo "::error::A known or likely secret (leaked credential, prod DB host, AWS key, or private key) was added in this change (checked per-commit). Move it to an env var / secret manager and rotate the credential."
            grep -En "$hard" added.txt | head -20 | sed 's/^/  /'
            exit 1
          fi

          # Credential-bearing connection strings: hard-fail on non-allowlisted hosts,
          # unless the password is an obvious placeholder (then warn). Allowed hosts
          # are boundary-anchored ([:/?# or end]) so db.evil.com does not match 'db'.
          # The '://' in these pattern literals is fragment-split for the same
          # no-self-match reason as above.
          conn='[a-zA-Z0-9+]+:''//[^:/@[:space:]]+:[^@[:space:]]+@'
          allow='@(localhost|127\.0\.0\.1|0\.0\.0\.0|ci-dummy|test-host|example\.[a-z]+|db|postgres|redis|timescaledb|mongo|host|HOST)([:/?#[:space:]]|$)'
          placeholder=':''//[^:/@[:space:]]+:(\$[{]?[A-Za-z_]+[}]?|<[^@]*>|%s|[{][{][^@]*[}][}]|(pw?|x+|y|z|pass(word)?|changeme|change-me|dummy|example|test|ci|u|user)[!]?)@'
          conn_lines="$(grep -E "$conn" added.txt | grep -Ev "$allow" || true)"
          if [ -n "$conn_lines" ]; then
            real_hits="$(echo "$conn_lines" | grep -Ev "$placeholder" || true)"
            placeholder_hits="$(echo "$conn_lines" | grep -E "$placeholder" || true)"
            if [ -n "$placeholder_hits" ]; then
              echo "::warning::Added connection string(s) with placeholder credentials for a non-local host — verify:"
              echo "$placeholder_hits" | head -10 | sed 's/^/  /'
            fi
            if [ -n "$real_hits" ]; then
              echo "::error::Added connection string(s) appear to embed REAL credentials for a non-local host. Move them to env vars / a secret manager."
              echo "$real_hits" | head -10 | sed 's/^/  /'
              exit 1
            fi
          fi

          echo "No new secrets detected in the scanned range."

  # Wave 1.11 — full-tree baseline scan. The diff gate above stops NEW bleeding;
  # this job asserts the WHOLE TREE state:
  #   - the leaked DB password: ZERO tolerance (the tracked backlog was scrubbed to
  #     __ROTATED_DB_PASSWORD__ sentinels in Wave 1.11; only rotation E1 + history
  #     purge E2 finish the job — this keeps the working tree clean meanwhile)
  #   - the legacy production IP: every carrier must be listed in
  #     .security/full-tree-baseline.txt (shrink-only; fails on any NEW carrier)
  full-tree-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Full-tree scan against the baseline
        run: |
          set -u
          # patterns assembled from fragments so this workflow cannot self-match
          pw='P@ssw0rd''123!'
          ip='43.208''.201.191'
          fail=0

          hits="$(git ls-files -z | xargs -0 grep -l -F "$pw" 2>/dev/null || true)"
          if [ -n "$hits" ]; then
            echo "::error::leaked DB password present in tracked files:"; echo "$hits"
            fail=1
          fi

          git ls-files -z | xargs -0 grep -l -F "$ip" 2>/dev/null | sort > ip-now.txt || true
          grep -v '^#' .security/full-tree-baseline.txt | sed '/^$/d' | sort > ip-allowed.txt
          new="$(comm -13 ip-allowed.txt ip-now.txt)"
          if [ -n "$new" ]; then
            echo "::error::legacy production IP in files NOT in the baseline (fix the file, do not extend the baseline):"; echo "$new"
            fail=1
          fi
          cleaned="$(comm -23 ip-allowed.txt ip-now.txt)"
          if [ -n "$cleaned" ]; then
            echo "::notice::baseline entries now clean (please shrink .security/full-tree-baseline.txt):"; echo "$cleaned"
          fi
          exit $fail
