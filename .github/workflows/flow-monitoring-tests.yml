# flow-monitoring CI gate (Wave 0.1, widened to bare pytest in Wave 1.9).
#
# `pytest` from the service root IS the gate: the legacy/broken suites and the
# dead-code mass were purged in Waves 1.6-1.9, so the whole tree collects and runs
# green with coverage scoped to the pure core/ kernel (>=90%). Keep new tests
# DB-free (construct against the canonical configs; stub external seams).
name: flow-monitoring-tests

on:
  pull_request:
    paths:
      - "services/flow-monitoring/**"
      - ".github/workflows/flow-monitoring-tests.yml"
      # repo-root survey oracle read by test_network_topology's SCADA-geometry check
      - "canal_sections_6zones_final.json"
  push:
    branches: [main]
    paths:
      - "services/flow-monitoring/**"
      - ".github/workflows/flow-monitoring-tests.yml"
      - "canal_sections_6zones_final.json"

permissions:
  contents: read

concurrency:
  group: flow-monitoring-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/flow-monitoring
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/flow-monitoring/requirements.txt

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Isolated unit suites (pure core + control API + settings; DB-free)
        env:
          PYTHONPATH: src
          # config/settings.py instantiates Settings() at import time with required DB
          # fields; locally a git-ignored .env masks this. CI provides clearly-dummy
          # values — the suites never open a connection (stubs only).
          INFLUXDB_URL: http://ci-dummy:8086
          INFLUXDB_TOKEN: ci-dummy-token
          INFLUXDB_ORG: ci-dummy-org
          INFLUXDB_BUCKET: ci-dummy-bucket
          TIMESCALE_URL: postgresql://ci:ci@ci-dummy:5432/sensor_data
          POSTGRES_URL: postgresql://ci:ci@ci-dummy:5432/postgres
          REDIS_URL: redis://ci-dummy:6379/0
        # Wave 1.9: bare pytest IS the gate — the dead-code purges made the whole
        # tree collectible and green, so the explicit isolated-suite list (and its
        # drift-guard manifest) is retired. Coverage is scoped to the pure core/
        # kernel (>=90%); orchestration/IO layers are exercised, not cov-gated.
        run: pytest -q --cov-fail-under=90

