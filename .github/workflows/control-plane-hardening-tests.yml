# control-plane hardening CI gate (PR 4.4a-3).
#
# DORMANT: GitHub Actions billing is locked (remediation item E6), so this
# workflow is tracked-but-not-running — admin-merge + local bare pytest is the
# real gate today. It is written to be CORRECT so that restoring Actions billing
# (and making this a required check) needs no rework.
#
# Ten jobs:
#   - scheduler-tests: the scheduler bare-pytest gate (integration suites skip
#     without SCHEDULER_TEST_POSTGRES_URL). Also covers the PR 6.0 Python half of
#     the machine-boundary v1 contract (jsonschema + pydantic).
#   - bff-tests: the bff-water-planning bare-pytest gate.
#   - ros-tests: the complete ROS-GIS source suite (DB contracts skip without
#     their explicit disposable-database URLs).
#   - ros-postgis-integration: the authoritative source-loader activation and
#     immutable requirement publication gate against disposable PostGIS.
#   - control-plan-local-harness-tests: the host orchestrator, exact stage
#     contracts, partial-failure collector, and campaign-ledger validation.
#   - bff-postgres-integration: the planning-depth migration, immutable
#     submission ledger, replay/conflict, concurrency, and rollback gate against
#     an ephemeral loopback Postgres.
#   - scada-gate-control-tests: the TypeScript SCADA gate (typecheck + lint +
#     vitest). It asserts the SAME machine-boundary v1 manifest fixture vector +
#     contract-set hash as the scheduler suite, so both passing proves the
#     Python and TypeScript validators agree (PR 6.0 cross-language boundary).
#   - scada-gate-control-web-tests: the authenticated SCADA web surface
#     (typecheck + lint + vitest + production build), including the isolated
#     read-only gate route used by control-plan evidence.
#   - scheduler-postgres-integration: an ephemeral loopback Postgres against
#     which every migration is applied / rolled back / re-applied and the
#     env-gated control-plan integration suites run for real (keyset over real
#     rows, 0004 index round-trip).
#   - pm2-infrastructure-tests: exact-release preflight, dark host topology,
#     monitoring rule coverage, and safe evidence projection.
name: control-plane-hardening-tests

on:
  pull_request:
    paths:
      - "services/scheduler/**"
      - "services/bff-water-planning/**"
      - "services/ros-gis-integration/**"
      - "ops/control-plan-read-local/**"
      - "docs/operations/control-plan-campaign-ledger.jsonl"
      - "docs/operations/CONTROL_PLAN_ALL_STAGES_LOCAL_ACCEPTANCE.md"
      - "services/scada-gate-control/**"
      - "services/scada-gate-control-web/**"
      - "contracts/control-plans/**"
      - "contracts/control-plan-evidence/**"
      - "contracts/planning-depth-submissions/**"
      - "contracts/planning-depth-roster/**"
      - "contracts/rid-calendar/**"
      - "contracts/machine-boundary/**"
      - "contracts/control-commissioning/**"
      - "infra/pm2/**"
      - "infra/monitoring/**"
      - "scripts/check-machine-boundary-contracts.sh"
      - ".github/workflows/control-plane-hardening-tests.yml"
  push:
    branches: [main]
    paths:
      - "services/scheduler/**"
      - "services/bff-water-planning/**"
      - "services/ros-gis-integration/**"
      - "ops/control-plan-read-local/**"
      - "docs/operations/control-plan-campaign-ledger.jsonl"
      - "docs/operations/CONTROL_PLAN_ALL_STAGES_LOCAL_ACCEPTANCE.md"
      - "services/scada-gate-control/**"
      - "services/scada-gate-control-web/**"
      - "contracts/control-plans/**"
      - "contracts/control-plan-evidence/**"
      - "contracts/planning-depth-submissions/**"
      - "contracts/planning-depth-roster/**"
      - "contracts/rid-calendar/**"
      - "contracts/machine-boundary/**"
      - "contracts/control-commissioning/**"
      - "infra/pm2/**"
      - "infra/monitoring/**"
      - "scripts/check-machine-boundary-contracts.sh"
      - ".github/workflows/control-plane-hardening-tests.yml"

permissions:
  contents: read

concurrency:
  group: control-plane-hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each job below inlines its own clearly-dummy env for the import-time Settings()
# (required fields with no defaults). The suites never open these connections —
# they inject fakes / httpx.MockTransport — so the values only have to be
# well-formed.
jobs:
  scheduler-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/scheduler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/scheduler/requirements.txt
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Bare pytest (the gate); integration suites skip without a DB
        env:
          PYTHONPATH: src
          POSTGRES_URL: postgresql://ci-dummy:ci-dummy@ci-dummy:5432/ci_dummy
          REDIS_URL: redis://ci-dummy:6379/0
          ROS_SERVICE_URL: http://ci-dummy:3000
          GIS_SERVICE_URL: http://ci-dummy:3000
          FLOW_MONITORING_URL: http://ci-dummy:3000
          ROS_GIS_URL: http://ci-dummy:3000
          WEATHER_SERVICE_URL: http://ci-dummy:3000
          AUTH_SERVICE_URL: http://ci-dummy:3000
          JWT_SECRET_KEY: ci-control-plane-jwt-secret-key-0123456789abcdef
          JWT_ISSUER: munbon-auth-ci
          JWT_AUDIENCE: munbon-scheduler-ci
          JWT_ACCESS_TOKEN_TYPE: access
          JWT_CLAIM_POLICY_MODE: compat
        run: python -m pytest -q

  bff-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/bff-water-planning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/bff-water-planning/requirements.txt
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Bare pytest (the gate)
        env:
          # conftest seeds CORS_ORIGINS; provide it explicitly too so the gate
          # never depends on a developer .env.
          CORS_ORIGINS: http://localhost:3000
        run: python -m pytest -q

  ros-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ros-gis-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/ros-gis-integration/requirements.txt
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: ROS-GIS complete source suite (DB contracts skip without their explicit URLs)
        run: python -m pytest -q

  control-plan-local-harness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/ros-gis-integration/requirements.txt
      - name: Install pinned ROS-GIS dependencies
        run: pip install -r services/ros-gis-integration/requirements.txt
      - name: Local acceptance harness contracts
        run: >-
          python -m pytest -q
          ops/control-plan-read-local/tests/test_stage_suite.py
          ops/control-plan-read-local/tests/test_orchestrate.py
          ops/control-plan-read-local/tests/test_seed_approved_sources.py
          ops/control-plan-read-local/tests/test_local_artifacts.py
      - name: Campaign ledger is valid and append-only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base_ledger="$RUNNER_TEMP/control-plan-campaign-ledger.base.jsonl"
          if ! git cat-file -e "${BASE_SHA}^{commit}"; then
            echo "campaign_ledger_base_commit_unavailable" >&2
            exit 1
          fi
          if git cat-file -e "$BASE_SHA:docs/operations/control-plan-campaign-ledger.jsonl"; then
            git show "$BASE_SHA:docs/operations/control-plan-campaign-ledger.jsonl" > "$base_ledger"
          else
            : > "$base_ledger"
          fi
          python ops/control-plan-read-local/orchestrate.py validate-campaign-ledger \
            --campaign-ledger docs/operations/control-plan-campaign-ledger.jsonl \
            --base-campaign-ledger "$base_ledger"

  ros-postgis-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ros-gis-integration
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ros_gis_roster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/ros-gis-integration/requirements.txt
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Apply ROS-GIS migrations
        env:
          POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/ros_gis_roster_test
        run: |
          python migrations/migrate.py apply 0001_dataset_version_parent
          python migrations/migrate.py apply 0002_water_requirement_publication
          python migrations/migrate.py apply 0003_daily_requirement_producer
          python migrations/migrate.py apply 0004_dataset_version_identity_immutable
      - name: Authoritative roster activation and publication suites (real PostGIS)
        env:
          WATER_REQUIREMENT_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/ros_gis_roster_test
        run: >-
          python -m pytest -q
          tests/integration/test_water_requirement_repository_postgres.py
      - name: "Dataset-version immutability suite (real PostGIS, #150)"
        env:
          DATASET_VERSION_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/ros_gis_roster_test
        run: >-
          python -m pytest -q
          tests/integration/test_dataset_version_immutability_postgres.py

  bff-postgres-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/bff-water-planning
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bff_planning_depth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/bff-water-planning/requirements.txt
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Planning-depth integration suites (real Postgres)
        env:
          CORS_ORIGINS: http://localhost:3000
          BFF_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/bff_planning_depth_test
        run: python -m pytest -q tests/integration/test_planning_depth_postgres.py

  scheduler-postgres-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/scheduler
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scheduler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/scheduler/requirements.txt
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Migration round-trip (apply-all -> rollback each -> apply-all)
        env:
          # migrate.py reads POSTGRES_URL directly (loopback disposable DB).
          POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/scheduler_test
        run: |
          python migrations/migrate.py apply-all
          python migrations/migrate.py rollback 0013_operator_approved_execution
          python migrations/migrate.py rollback 0012_authority_grants
          python migrations/migrate.py rollback 0011_gate_readback_observations
          python migrations/migrate.py rollback 0010_shadow_dispatch_receipts
          python migrations/migrate.py rollback 0009_open_loop_execution
          python migrations/migrate.py rollback 0008_control_plan_active_supersede
          python migrations/migrate.py rollback 0007_control_plan_shadow_activation
          python migrations/migrate.py rollback 0006_control_plan_campaign_identity
          python migrations/migrate.py rollback 0005_control_plan_provenance_v2
          python migrations/migrate.py rollback 0004_control_plan_list_indexes
          python migrations/migrate.py rollback 0003_control_plan_review_lifecycle
          python migrations/migrate.py rollback 0002_predicted_delivery_ledger
          python migrations/migrate.py rollback 0001_control_plan_drafts
          python migrations/migrate.py apply-all
          python migrations/migrate.py status
      - name: Reset schema before the env-gated integration suites
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d scheduler_test -c "DROP SCHEMA IF EXISTS scheduler CASCADE"
      - name: Env-gated control-plan integration suites (real Postgres)
        env:
          PYTHONPATH: src
          # A DISPOSABLE loopback DB — the integration guard rejects non-loopback.
          POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/scheduler_test
          SCHEDULER_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/scheduler_test
          REDIS_URL: redis://ci-dummy:6379/0
          ROS_SERVICE_URL: http://ci-dummy:3000
          GIS_SERVICE_URL: http://ci-dummy:3000
          FLOW_MONITORING_URL: http://ci-dummy:3000
          ROS_GIS_URL: http://ci-dummy:3000
          WEATHER_SERVICE_URL: http://ci-dummy:3000
          AUTH_SERVICE_URL: http://ci-dummy:3000
          JWT_SECRET_KEY: ci-control-plane-jwt-secret-key-0123456789abcdef
          JWT_ISSUER: munbon-auth-ci
          JWT_AUDIENCE: munbon-scheduler-ci
          JWT_ACCESS_TOKEN_TYPE: access
          JWT_CLAIM_POLICY_MODE: compat
        run: python -m pytest -q tests/integration

  scada-gate-control-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/scada-gate-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/scada-gate-control/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Typecheck, lint, and vitest (incl. machine-boundary v1 cross-language contract)
        run: |
          npm run typecheck
          npm run lint
          npm test

  scada-gate-control-web-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/scada-gate-control-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/scada-gate-control-web/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Typecheck, lint, vitest, and production build
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

  pm2-infrastructure-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/pm2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: infra/pm2/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Typecheck, lint, topology, preflight, monitoring, and evidence tests
        run: |
          npm run lint
          npm run verify
