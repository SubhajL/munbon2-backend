[pytest]
# Pytest configuration for Flow Monitoring Service

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    --strict-markers
    --tb=short
    --cov=src/core
    --cov-report=term-missing

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    performance: Performance benchmark tests
    slow: Tests that take significant time
    asyncio: Asynchronous tests

# Asyncio configuration
asyncio_mode = auto

# Coverage configuration
[coverage:run]
source = src/core
omit =
    */tests/*
    */conftest.py
    */__init__.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING: